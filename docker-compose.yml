services:
  postgres:
    image: postgres:16-alpine
    container_name: docs-hub-db
    environment:
      POSTGRES_DB: docs_hub
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5440:5432"
    volumes:
      - docs_hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d docs_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docs-hub-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docs-hub-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/docs_hub
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-docsHubSecretKeyForJwtTokenGenerationMinimum256Bits1234}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8090/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - docs-hub-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docs-hub-frontend
    ports:
      - "4210:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - docs-hub-net

volumes:
  docs_hub_pgdata:
    name: docs_hub_pgdata

networks:
  docs-hub-net:
    driver: bridge
